name: Vyce Vps-Mini Stock Watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: vyce-free-vps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-and-create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Playwright browser
        run: |
          python -m pip install --disable-pip-version-check --no-input playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Check published stock and use the normal create form
        env:
          VYCE_COOKIE: ${{ secrets.VYCE_COOKIE }}
          VYCE_SSH_PUBLIC_KEY: ${{ secrets.VYCE_SSH_PUBLIC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: '1'
          PROXY_SERVER: ''
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
          TG_BOT_TOKEN: ''
          TG_CHAT_ID: ''
        run: |
            unset https_proxy http_proxy
            python auto_create.py
